
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: wil-playground
  namespace: argocd

spec:
  project: default
  source:
    repoURL: http://192.168.56.10/root/app.git
    targetRevision: main
    path: confs/manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
